<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="clay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4956A"/>
      <stop offset="100%" style="stop-color:#8B5E3C"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Background circle — dark earth -->
  <circle cx="256" cy="256" r="240" fill="#1A1210"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#8B5E3C" stroke-width="2" opacity="0.4"/>

  <!-- Golem head silhouette — angular, clay-like -->
  <path d="
    M 180 360
    L 165 260
    L 170 200
    Q 175 140 220 115
    Q 256 95 292 115
    Q 337 140 342 200
    L 347 260
    L 332 360
    Q 310 380 256 385
    Q 202 380 180 360
    Z
  " fill="url(#clay)" opacity="0.85"/>

  <!-- Forehead inscription — אמת (emet/truth) -->
  <text x="256" y="205" text-anchor="middle" font-family="serif" font-size="56" font-weight="bold" fill="url(#glow)" letter-spacing="4">אמת</text>

  <!-- Eyes — glowing -->
  <ellipse cx="220" cy="255" rx="18" ry="14" fill="#1A1210"/>
  <ellipse cx="292" cy="255" rx="18" ry="14" fill="#1A1210"/>
  <ellipse cx="222" cy="254" rx="8" ry="7" fill="#FFD700" opacity="0.8"/>
  <ellipse cx="294" cy="254" rx="8" ry="7" fill="#FFD700" opacity="0.8"/>

  <!-- Mouth — stern line -->
  <path d="M 225 310 Q 256 320 287 310" fill="none" stroke="#1A1210" stroke-width="4" stroke-linecap="round"/>

  <!-- Cracks in clay — texture -->
  <path d="M 200 170 L 210 195 L 205 220" fill="none" stroke="#6B4226" stroke-width="1.5" opacity="0.5"/>
  <path d="M 310 175 L 305 200 L 312 225" fill="none" stroke="#6B4226" stroke-width="1.5" opacity="0.5"/>
  <path d="M 185 300 L 195 320 L 190 345" fill="none" stroke="#6B4226" stroke-width="1.5" opacity="0.5"/>
  <path d="M 327 295 L 320 318 L 325 340" fill="none" stroke="#6B4226" stroke-width="1.5" opacity="0.5"/>

  <!-- Terminal cursor — the "words" that animate -->
  <rect x="350" y="365" width="12" height="24" fill="#FFD700" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Terminal prompt hint -->
  <text x="335" y="386" font-family="monospace" font-size="22" fill="#FFD700" opacity="0.7">▸</text>
</svg>
